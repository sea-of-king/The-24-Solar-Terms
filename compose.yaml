services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      tree-hole:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8088}:80"
    restart: unless-stopped

  tree-hole:
    build:
      context: .
      dockerfile: Dockerfile.tree-hole
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TREE_HOLE_PORT: "8080"
      TREE_HOLE_DSN: "root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/solar_terms?charset=utf8mb4&parseTime=True&loc=Local"
      TREE_HOLE_REDIS_ADDR: "${TREE_HOLE_REDIS_ADDR:-redis:6379}"
      TREE_HOLE_REDIS_PASSWORD: "${TREE_HOLE_REDIS_PASSWORD:-}"
      TREE_HOLE_CORS_ORIGINS: "${TREE_HOLE_CORS_ORIGINS:-http://localhost,http://127.0.0.1}"
      TREE_HOLE_DB_MAX_OPEN_CONNS: "${TREE_HOLE_DB_MAX_OPEN_CONNS:-20}"
      TREE_HOLE_DB_MAX_IDLE_CONNS: "${TREE_HOLE_DB_MAX_IDLE_CONNS:-10}"
      TREE_HOLE_DB_CONN_MAX_LIFETIME_SECONDS: "${TREE_HOLE_DB_CONN_MAX_LIFETIME_SECONDS:-180}"
      TREE_HOLE_DB_CONN_MAX_IDLE_SECONDS: "${TREE_HOLE_DB_CONN_MAX_IDLE_SECONDS:-60}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/tree-hole/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "8765"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEFAULT_ASSISTANT_ID: ${DEFAULT_ASSISTANT_ID:-solar-terms}
      AI_DATABASE_URL: postgresql://assistant:${AI_POSTGRES_PASSWORD}@postgres:5432/assistant
      AI_REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: amqp://assistant:${RABBITMQ_PASSWORD}@rabbitmq:5672/assistant
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      AI_DATABASE_POOL_MIN_SIZE: ${AI_DATABASE_POOL_MIN_SIZE:-1}
      AI_DATABASE_POOL_MAX_SIZE: ${AI_DATABASE_POOL_MAX_SIZE:-10}
      AI_DATABASE_COMMAND_TIMEOUT_SECONDS: ${AI_DATABASE_COMMAND_TIMEOUT_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
      ai-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=INFO", "--queues=knowledge", "--without-mingle", "--without-gossip"]
    environment:
      AI_DATABASE_URL: postgresql://assistant:${AI_POSTGRES_PASSWORD}@postgres:5432/assistant
      CELERY_BROKER_URL: amqp://assistant:${RABBITMQ_PASSWORD}@rabbitmq:5672/assistant
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      AI_DATABASE_POOL_MIN_SIZE: ${AI_DATABASE_POOL_MIN_SIZE:-1}
      AI_DATABASE_POOL_MAX_SIZE: ${AI_DATABASE_POOL_MAX_SIZE:-10}
      AI_DATABASE_COMMAND_TIMEOUT_SECONDS: ${AI_DATABASE_COMMAND_TIMEOUT_SECONDS:-15}
    depends_on:
      postgres:
        condition: service_healthy
      ai-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celery-worker.ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD}
    volumes:
      - ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ai-migrate:
    image: pgvector/pgvector:pg17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${AI_POSTGRES_PASSWORD}
    volumes:
      - ./database/ai_schema.sql:/migrations/ai_schema.sql:ro
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -h postgres -U assistant -d assistant -f /migrations/ai_schema.sql"]
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: assistant
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: assistant
    volumes:
      - rabbitmq-data-v43:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: solar_terms
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  ai-postgres-data:
  rabbitmq-data-v43:
